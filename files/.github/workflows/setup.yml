# The first installation of this repository: its owner presses «Run workflow» on main, with
# her answers. This file is frozen: it holds what GitHub reads from a workflow file — the form,
# the rights and the one step. What the step does is main's code under engine/. The answers
# reach the code as environment variables, never inside the script's text.
name: setup

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Your AI
        required: true
        type: choice
        options: [chatgpt, claude, grok]
      language:
        description: Your language, as a code — ru, en, he, uk, de, pt-BR
        required: true
        type: string
      country:
        description: Your country, two letters — IL, DE, US
        required: true
        type: string
      timezone:
        description: Your time zone — Asia/Jerusalem, Europe/Berlin, America/New_York
        required: true
        type: string
      name:
        description: Your name, as your AI will call you
        required: true
        type: string
      gender:
        description: For the grammar of your language
        required: true
        type: choice
        options: [female, male]
      work_languages:
        description: Other languages you work in, as codes, comma-separated — en,he (or leave empty)
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: setup
  cancel-in-progress: false

jobs:
  setup:
    # A dispatch on any other branch would run that branch's copy of this file.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write         # the setup's branch
      pull-requests: write    # its PR
      issues: write           # the Issue with her instructions
      actions: write          # start the gate on that PR
    steps:
      - name: Code from main — the commit whose copy of this workflow runs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          LANGUAGE: ${{ inputs.language }}
          COUNTRY: ${{ inputs.country }}
          TIMEZONE: ${{ inputs.timezone }}
          NAME: ${{ inputs.name }}
          GENDER: ${{ inputs.gender }}
          WORK_LANGUAGES: ${{ inputs.work_languages }}
        run: >-
          python3 -m engine.setup.setup_run --main "$GITHUB_SHA"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --platform="$PLATFORM" --language="$LANGUAGE" --country="$COUNTRY" --timezone="$TIMEZONE"
          --name="$NAME" --gender="$GENDER" --work-languages="$WORK_LANGUAGES"
