# The gate of this repository. This file is frozen: it holds what GitHub reads from a workflow
# file — the triggers, the rights, the jobs and the order of their steps. What a step does is
# main's code under engine/, so an engine update changes that code and leaves this file as it is.
name: check

on:
  # Runs main's code on the PR's objects; never checks out or runs the PR's code.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, synchronize, reopened, edited]   # edited: the PR's body is checked too
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the PR to check
        required: true
        type: number

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  check:
    # A dispatch on any other branch would run that branch's copy of this file;
    # an edit to a closed PR starts nothing.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read          # main's code, the branches, the PR's objects, the record of main
      pull-requests: read     # the PR itself; which PR a merge came from
      statuses: write         # the status `gate` on the PR's head
      actions: read           # the runs of this workflow and their logs
      issues: write           # the alarm Issues
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      body_sha: ${{ steps.pr.outputs.body_sha }}
    steps:
      - name: Gate pending at once
        # First, before anything is checked out or read: a run that fails early must not leave
        # an earlier `gate` of this head standing. The event carries the head; a dispatch does
        # not, and is marked by «Gate pending» below.
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=pending -f context=gate
          -f description="checking" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Code from main — the commit whose copy of this workflow runs
        # github.sha, not `ref: main`: a re-run of an old run executes the old copy of this
        # file, and must run the code of that same commit.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The PR as data
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          SENDER: ${{ github.event.sender.login }}
        run: python3 -m engine.checks.gate pr

      - name: Gate pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=pending -f context=gate
          -f description="checking" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: The checks of the PR
        # No token here: this step reads what the PR brings.
        env:
          PR: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
          KIND: ${{ steps.pr.outputs.kind }}
          ACTOR: ${{ steps.pr.outputs.actor }}
          BEFORE: ${{ steps.pr.outputs.before }}
        run: python3 -m engine.checks.gate checks

      - name: The watch of main, inside the gate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: python3 -m engine.checks.gate watch

      - name: Gate passed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=success -f context=gate
          -f description="all checks passed" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Gate failed
        # The head read from the PR; a run that failed before reading it — the event's head.
        if: failure() && (steps.pr.outputs.head != '' || github.event_name == 'pull_request_target')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head || github.event.pull_request.head.sha }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=failure -f context=gate
          -f description="a check blocked or could not run" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  merge:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One merge at a time: two PRs checked against the same main cannot both land.
    concurrency:
      group: merge-main
      cancel-in-progress: false
    permissions:
      contents: write         # the merge, and deleting the merged branch
      pull-requests: write    # the merge of the PR
      statuses: write         # `gate` back to pending when main moved
      actions: write          # start the check again
    steps:
      - name: Code from main — the commit whose copy of this workflow runs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Merge exactly the head and the record that check verified, onto the main it read
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.check.outputs.number }}
          HEAD: ${{ needs.check.outputs.head }}
          BASE: ${{ needs.check.outputs.base }}
          BODY_SHA: ${{ needs.check.outputs.body_sha }}
        run: python3 -m engine.checks.gate merge
