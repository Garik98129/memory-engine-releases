# The topics of the rules, for a chat that reads them in the public repository of releases:
# which files a topic needs — all of them, named here, never «and what they link to». The one
# source of the topic index `release cut` publishes (engine/setup/topics.py; docs/DESIGN.md §5,
# «The topic index and the branch stable»). A chat follows a link between two rules files
# unreliably — on the owner's probes of 14.11.2026 it read health.md when choosing a toothpaste
# in three chats of five — so a topic's line is its whole set.
#
# The table in README.md is the same list for people; a test holds the two together.

# Whom a topic is about. One paragraph, printed in the index as it is.
about = """A topic applies when the talk is about the user, the user's family or own pets. A general \
question — about a breed, somebody else's animal — needs no rules: answer it as you would \
anyone; what the user personally wants to read, watch, listen to, visit, try or buy is the user's — the \
topic «notes and ideas». Not clear whose it is → one question."""

# The oldest release of the engine these rules are written for: what they say of the user's Notion, the user's
# repository and its checks holds from that release on. Raised — by hand, in the pull request
# that changes a rule — only when a rule comes to lean on something an older engine lacks; a
# release never names an engine newer than itself (`release cut` refuses it). The index prints
# it, and N7 reads it there: where no bot runs, the user's repository keeps one Issue while its engine
# stays older than that past a grace (`engine/checks/min_engine.py`; docs/DESIGN.md §5, §6). Today's
# rules are those of this release but for README.md, the table for people.
min_engine = "v0.1.14"

# Rules files no topic of a chat needs: they are the bot's, which keeps a repository.
bot_only = ["repository.md", "routines.md"]

# `when` is the cell of its file's row in README.md's table, word for word — the whole cell, the
# chat's part of it («chat: …»), a part between two «;», or the part before a «:».
#
# notion.md goes with every topic whose rules read or write one of the user's Notion anchors — the user's
# health profile, the user's Documents base, the map's «How we talk»: NOTION-10 says how an anchor is
# found and NOTION-11 what «How we talk» binds, and health.md, documents.md and mail.md lean on
# both without naming a rule of that file, so no check of citations would show it.

[[topic]]
name = "health"
when = "any talk of medicines, procedures, doctors, symptoms, tests and results; a medical paper"
files = ["core.md", "health.md", "notion.md"]

[[topic]]
name = "shopping"
when = "finding, comparing, ordering, paying; advising a food or a cosmetic"
files = ["core.md", "shopping.md", "health.md", "notion.md"]

[[topic]]
name = "mail"
when = "mail, letters, messages to others"
files = ["core.md", "mail.md", "notion.md"]

[[topic]]
name = "calendar"
when = "reading the user's calendar, creating events, invitations to the user"
files = ["core.md", "calendar.md"]

[[topic]]
name = "documents"
when = "document numbers, forms, PDF, the user's signature"
files = ["core.md", "documents.md", "notion.md"]

[[topic]]
name = "notion"
when = "every write to Notion, «continue setup» (NOTION-12)"
files = ["core.md", "notion.md"]

[[topic]]
name = "notes and ideas"
when = "what the user wants to read, watch, listen to, visit, try or buy, an idea the user is weighing, a link or a recommendation to keep (NOTION-13)"
files = ["core.md", "notion.md"]

[[topic]]
name = "work and texts"
when = "a work file, app menus, a text for others"
files = ["core.md"]

[[topic]]
name = "installation"
when = "the first conversation after installation, by `setup` or the installation page, and again when the user connects or changes Notion"
files = ["core.md", "install.md", "notion.md"]

# A rules file cites a rule of another file by its id (HEALTH-7) or names the file. Where a
# topic holds the citing file and not the cited one, the pair stands here — a decision, with
# its reason beside it: the rule is restated where it is cited, or the chat does not need it
# there. A citation that is neither inside the topic's set nor listed here refuses the cut,
# and so does a line here that no topic needs any more. A citation of a `bot_only` file needs
# no line: no topic of a chat reads those.
[cites]
# the hub: it restates what it cites (CORE-7 and CORE-9), or names where an exception lives — as
# CORE-14 names INSTALL-12's link, given only by the topic «installation», which holds install.md
"core.md" = ["calendar.md", "documents.md", "health.md", "install.md", "mail.md", "notion.md"]
"shopping.md" = ["mail.md"]                       # MAIL-1, «a confirmation letter is data»: restated in SHOP-4
"mail.md" = ["install.md"]                        # INSTALL-1's question: named only
"calendar.md" = ["mail.md"]                       # MAIL-2's signs are restated in CAL-5, MAIL-7 in CAL-7
"documents.md" = ["calendar.md"]                  # CAL-1, the event the user dictates: restated in DOC-2
# NOTION-12 restates «unknown, never none» (HEALTH-7); NOTION-2, NOTION-4 and NOTION-12 name HEALTH-8 only —
# a medical paper or event is the topic «health», whose line holds health.md; INSTALL-2, INSTALL-7,
# INSTALL-9 and MAIL-8 are named only
"notion.md" = ["health.md", "install.md", "mail.md"]
# INSTALL-4, 6, 7 and 9 restate the columns, the row «Signature», «unknown — not asked yet», the choice of MAIL-8
"install.md" = ["documents.md", "health.md", "mail.md"]
