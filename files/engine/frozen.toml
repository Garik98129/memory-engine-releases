# The workflow files a release ships (engine/workflows/) are frozen: they hold only what GitHub
# reads from a workflow file, and what their steps do is code under engine/. A release that
# changes one of them is not carried by the weekly update — GITHUB_TOKEN cannot write workflow
# files — and waits, in every installed repository, for somebody to apply it by hand.
#
# So a change there is a decision, never a side effect. A test holds every file to the sha256
# below; `release cut` refuses a release whose workflow files differ from the release before
# unless it is told so (--changes-workflows), and then asks for a higher `version` here.

[workflows]
version = 1

[workflows.sha256]
