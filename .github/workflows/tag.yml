# Sets a release's tag (the template's docs/DESIGN.md §5): each commit of a push to main
# that changes release-manifest.json gets the tag its manifest names. The
# owner's word stays on cutting the release — Claude Code pushes a manifest only on it;
# this replaces the owner's hand on the tag. It only creates a tag: the tag ruleset
# forbids moving or deleting one, and a tag that exists already, or one not newer than
# the newest, is a red run and no tag.
name: tag

on:
  push:
    branches: [main]
    paths: [release-manifest.json]

permissions: {}

concurrency:
  # One run at a time, and none cancelled: by default a newer run would cancel the one
  # waiting, and a release would get no tag and no red run.
  group: tag
  cancel-in-progress: false
  queue: max

jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # to push the tag
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0       # every commit of the push, not only its head
      - name: Tag each release the push brings
        env:
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/tag-release.sh "$BEFORE" "$GITHUB_SHA"
