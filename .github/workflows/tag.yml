# Sets a release's tag (the template's docs/DESIGN.md §5): when a commit brings a new
# release-manifest.json to main, the tag the manifest names goes on that commit. The
# owner's word stays on cutting the release — Claude Code pushes a manifest only on it;
# this replaces the owner's hand on the tag. It only creates a tag: the tag ruleset
# forbids moving or deleting one, and a tag that exists already, or one not newer than
# the newest, is a red run and no tag.
name: tag

on:
  push:
    branches: [main]
    paths: [release-manifest.json]

permissions: {}

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # to push the tag
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Tag the release the manifest names
        run: bash .github/scripts/tag-release.sh "$GITHUB_SHA"
